<svg width="760" height="480" viewBox="0 0 760 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="mrk18 — AI CMO landing preview">
  <defs>
    <linearGradient id="mrkMolten" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c05a2c"/>
      <stop offset="1" stop-color="#9c3f1f"/>
    </linearGradient>
    <linearGradient id="mrkGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9b070"/>
      <stop offset="1" stop-color="#b98a3f"/>
    </linearGradient>
    <linearGradient id="mrkTerra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c77a53"/>
      <stop offset="1" stop-color="#9c4f2f"/>
    </linearGradient>
    <filter id="mrkSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- window -->
  <rect x="8" y="8" width="744" height="464" rx="26" fill="#ECE6DA"/>
  <rect x="8.5" y="8.5" width="743" height="463" rx="25.5" stroke="#000" stroke-opacity="0.06"/>

  <!-- top bar -->
  <circle cx="44" cy="46" r="6" fill="#d98a6a"/>
  <circle cx="66" cy="46" r="6" fill="#d9b070"/>
  <circle cx="88" cy="46" r="6" fill="#bfc7a8"/>
  <rect x="286" y="34" width="188" height="24" rx="12" fill="#ffffff" fill-opacity="0.65"/>
  <text x="380" y="50" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6b6357" text-anchor="middle">mrk18.com</text>

  <!-- brand -->
  <g transform="translate(44,92)">
    <path d="M10 0 L20 12 L10 30 L0 12 Z" fill="url(#mrkMolten)"/>
    <text x="30" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="800" fill="#1c1a17">mrk<tspan fill="#9c3f1f">18</tspan></text>
  </g>

  <!-- free chip -->
  <rect x="300" y="102" width="204" height="26" rx="13" fill="#ffffff" fill-opacity="0.55"/>
  <text x="402" y="119" font-family="Arial, sans-serif" font-size="10.5" letter-spacing="1.6" font-weight="700" fill="#8a5a3a" text-anchor="middle">FREE ANALYSIS · NO SIGN-UP</text>

  <!-- headline -->
  <text x="44" y="212" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="800" fill="#1c1a17">Drop your URL.</text>
  <text x="44" y="274" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="800" fill="url(#mrkMolten)">Get your verdicts.</text>

  <!-- subtext -->
  <text x="44" y="312" font-family="Arial, sans-serif" font-size="16" fill="#6b6357">Your AI CMO reads it cold — real competitors, four honest verdicts.</text>

  <!-- input row -->
  <g filter="url(#mrkSoft)">
    <rect x="44" y="336" width="470" height="58" rx="16" fill="#ffffff"/>
  </g>
  <text x="70" y="371" font-family="Arial, sans-serif" font-size="17" fill="#a49a8b">yourbusiness.com</text>
  <rect x="530" y="336" width="176" height="58" rx="16" fill="url(#mrkMolten)"/>
  <text x="618" y="371" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Analyze free →</text>

  <!-- floating shapes -->
  <g opacity="0.95" filter="url(#mrkSoft)">
    <circle cx="600" cy="150" r="30" fill="url(#mrkGold)"/>
    <path d="M672 92 l34 18 v40 l-34 18 -34 -18 v-40 z" fill="url(#mrkTerra)"/>
    <ellipse cx="690" cy="250" rx="26" ry="16" fill="url(#mrkMolten)"/>
  </g>
</svg>
